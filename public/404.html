<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Redirect to the main app, preserving the path as a query param
    // (and forwarding any existing query string) so the SPA router can handle it
    const path = window.location.pathname;
    const search = window.location.search ? '&' + window.location.search.slice(1) : '';
    window.location.replace('/parametric-diagrams/?route=' + encodeURIComponent(path) + search);
  </script>
</head>
<body></body>
</html>
